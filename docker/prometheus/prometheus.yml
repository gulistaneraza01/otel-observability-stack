global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Thanos sidecar REQUIRES stable external labels to identify block owners
  external_labels:
    cluster: otel-lab
    replica: prom0

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
